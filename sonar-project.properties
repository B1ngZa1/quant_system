# SonarQube Project Properties
sonar.projectKey=quant_system
sonar.projectName=Quant System
sonar.projectVersion=1.0.0

# Path to sources
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Language specific configuration
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/migrations/**,**/alembic/**,**/*.html,**/*.css,**/*.config.js
sonar.coverage.exclusions=**/tests/**,**/migrations/**,**/alembic/**

# Quality Gate requirements
sonar.qualitygate.wait=true
